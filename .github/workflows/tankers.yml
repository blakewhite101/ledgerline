name: Tanker positions

on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  tankers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==13.1
      - run: python scripts/tankers.py 600
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Commit changes
        run: |
          git add -A data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "ledgerline-bot"
          git config user.email "ledgerline-bot@users.noreply.github.com"
          git commit -m "Tanker positions"
          git pull --rebase
          git push
