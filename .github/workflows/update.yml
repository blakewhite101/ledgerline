name: Refresh market data

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min during US market hours (UTC)
    - cron: "0 */3 * * *"          # every 3 hours otherwise, for overnight and weekend news
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit changes
        run: |
          git add -A index.html sitemap.xml data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "ledgerline-bot"
          git config user.email "ledgerline-bot@users.noreply.github.com"
          git commit -m "Refresh market data"
          git pull --rebase
          git push
